<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://p.trellocdn.com/power-up.css">
<link rel="stylesheet" href="./style.css">
<script src="https://p.trellocdn.com/power-up.min.js"></script>
</head><body><div id="root" class="grid"></div>
<script src="./shared.js"></script>
<script>
var t = TrelloPowerUp.iframe();
var values = {};
function save() { return t.set('card', 'shared', 'values', values); }
function render(fields) {
  var root = document.getElementById('root');
  root.innerHTML = '';
  fields.forEach(function (f) {
    var wrap = document.createElement('div'); wrap.className = 'field';
    var el;
    if (f.type === 'checkbox') {
      var l = document.createElement('label'); l.className = 'check';
      el = document.createElement('input'); el.type = 'checkbox'; el.checked = !!values[f.id];
      l.appendChild(el); l.appendChild(document.createTextNode(f.name));
      wrap.appendChild(l);
    } else {
      var lab = document.createElement('label'); lab.className = 'lbl'; lab.textContent = f.name; wrap.appendChild(lab);
      if (f.type === 'dropdown') {
        el = document.createElement('select');
        [''].concat(f.options || []).forEach(function (o) {
          var op = document.createElement('option'); op.value = o; op.textContent = o || 'Select…'; el.appendChild(op);
        });
      } else {
        el = document.createElement('input');
        el.type = { number: 'number', date: 'date' }[f.type] || 'text';
        el.placeholder = f.type === 'date' ? '' : 'Add ' + f.name.toLowerCase().replace(/ \(.*\)$/, '') + '…';
      }
      el.value = values[f.id] == null ? '' : values[f.id];
      wrap.appendChild(el);
    }
    el.addEventListener('change', function () {
      var v = f.type === 'checkbox' ? el.checked : el.value;
      if (f.type === 'number' && v !== '') v = Number(v);
      values[f.id] = v; save();
    });
    root.appendChild(wrap);
  });
  t.sizeTo('#root').catch(function () {});
}
t.render(function () {
  return Promise.all([getFields(t), getValues(t)]).then(function (r) { values = r[1]; render(r[0]); });
});
</script></body></html>
