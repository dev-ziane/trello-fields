<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://p.trellocdn.com/power-up.css">
<link rel="stylesheet" href="./style.css">
<script src="https://p.trellocdn.com/power-up.min.js"></script>
</head><body><div id="root"></div>
<script src="./shared.js"></script>
<script>
var t = TrelloPowerUp.iframe();
var fields = [];
var TYPES = ['text', 'number', 'dropdown', 'date', 'checkbox'];
function persist() { return t.set('board', 'shared', 'fields', fields); }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
function draw() {
  var root = document.getElementById('root'); root.innerHTML = '';
  root.appendChild(el('p', 'hint', 'Fields appear on every card in this board.'));
  if (!fields.length) root.appendChild(el('div', 'empty', 'No fields yet.'));
  fields.forEach(function (f, i) {
    var item = el('div', 'item'), top = el('div', 'top');
    var name = el('input'); name.type = 'text'; name.placeholder = 'Field name'; name.value = f.name;
    var type = el('select'); TYPES.forEach(function (x) { var o = el('option', '', x[0].toUpperCase() + x.slice(1)); o.value = x; type.appendChild(o); });
    type.value = f.type;
    var rm = el('button', 'btn icon', '✕'); rm.title = 'Remove field';
    top.appendChild(name); top.appendChild(type); top.appendChild(rm); item.appendChild(top);
    if (f.type === 'dropdown') {
      var d = el('div', 'opts'), o = el('input'); o.type = 'text'; o.placeholder = 'Options, separated by commas';
      o.value = (f.options || []).join(', '); d.appendChild(o); item.appendChild(d);
      o.onchange = function () { f.options = o.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean); persist(); };
    }
    var foot = el('div', 'foot'), lab = el('label', 'check'), cb = el('input'); cb.type = 'checkbox'; cb.checked = !!f.front;
    lab.appendChild(cb); lab.appendChild(document.createTextNode('Show on card front')); foot.appendChild(lab); item.appendChild(foot);
    name.onchange = function () { f.name = name.value; persist(); };
    type.onchange = function () { f.type = type.value; persist(); draw(); };
    cb.onchange = function () { f.front = cb.checked; persist(); };
    rm.onclick = function () { fields.splice(i, 1); persist(); draw(); };
    root.appendChild(item);
  });
  var add = el('button', 'btn primary', '+ Add field');
  add.onclick = function () { fields.push({ id: uid(), name: 'New field', type: 'text', front: false }); persist(); draw(); };
  root.appendChild(add);
  t.sizeTo('#root').catch(function () {});
}
t.render(function () { return getFields(t).then(function (f) { fields = f.map(function (x) { return Object.assign({}, x); }); draw(); }); });
</script></body></html>
