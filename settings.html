<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://p.trellocdn.com/power-up.css">
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<style>.f{border-bottom:1px solid #ddd;padding:6px 0}.f input,.f select{margin:2px 0}small{color:#666}</style>
</head><body><div id="root">Loading…</div>
<script src="./shared.js"></script>
<script>
var t = TrelloPowerUp.iframe();
var fields = [];
function persist() { return t.set('board', 'shared', 'fields', fields); }
function draw() {
  var root = document.getElementById('root'); root.innerHTML = '';
  fields.forEach(function (f, i) {
    var d = document.createElement('div'); d.className = 'f';
    d.innerHTML = '<input class="n" placeholder="Name"> <select class="ty"><option>text</option><option>number</option><option>dropdown</option><option>date</option><option>checkbox</option></select>' +
      '<input class="o" placeholder="Options, comma separated"><label><input type="checkbox" class="fr"> Show on card front</label> <button class="rm mod-danger">Remove</button>';
    d.querySelector('.n').value = f.name; d.querySelector('.ty').value = f.type;
    d.querySelector('.o').value = (f.options || []).join(', ');
    d.querySelector('.o').style.display = f.type === 'dropdown' ? '' : 'none';
    d.querySelector('.fr').checked = !!f.front;
    d.querySelector('.n').onchange = function (e) { f.name = e.target.value; persist(); };
    d.querySelector('.ty').onchange = function (e) { f.type = e.target.value; persist(); draw(); };
    d.querySelector('.o').onchange = function (e) { f.options = e.target.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean); persist(); };
    d.querySelector('.fr').onchange = function (e) { f.front = e.target.checked; persist(); };
    d.querySelector('.rm').onclick = function () { fields.splice(i, 1); persist(); draw(); };
    root.appendChild(d);
  });
  var add = document.createElement('button'); add.className = 'mod-primary'; add.textContent = 'Add field';
  add.onclick = function () { fields.push({ id: uid(), name: 'New field', type: 'text', front: false }); persist(); draw(); };
  root.appendChild(add);
  t.sizeTo('#root');
}
t.render(function () { return getFields(t).then(function (f) { fields = f.map(function (x) { return Object.assign({}, x); }); draw(); }); });
</script></body></html>
